name: YTA

options:
  developmentLanguage: en
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "18.0"

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    LOCALIZATION_PREFERS_STRING_CATALOGS: "YES"
    SWIFT_EMIT_LOC_STRINGS: "YES"

targets:
  YTA:
    type: application
    platform: iOS
    sources:
      # Excludes act as a safety net: these features were removed from the
      # app (July 2026); if stale copies linger in a working tree, they must
      # never reach the compiler or the bundle.
      - path: YTA
        excludes:
          - "Views/Home/WelcomeAvatar.swift"
          - "Views/Media/**"
          - "ViewModels/MediaViewModel.swift"
          - "Models/InstagramPost.swift"
          - "Resources/Videos/welcome-message.mp4"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.ytalebanon.app
        PRODUCT_NAME: YTA
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_FILE: Config/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: YTA Lebanon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.travel
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: "YES"

schemes:
  YTA:
    build:
      targets:
        YTA: all
    run:
      config: Debug
    archive:
      config: Release
