name: iOS Simulator Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build YTA for iOS Simulator
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for iOS Simulator (no code signing)
        run: |
          xcodebuild \
            -scheme YTA \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package simulator app
        run: |
          cd build/Build/Products/Debug-iphonesimulator
          zip -r YTA-Simulator-App.zip YTA.app

      - name: Upload simulator build artifact
        uses: actions/upload-artifact@v4
        with:
          name: YTA-iOS-Simulator-App
          path: build/Build/Products/Debug-iphonesimulator/YTA-Simulator-App.zip
          if-no-files-found: error
          retention-days: 30
