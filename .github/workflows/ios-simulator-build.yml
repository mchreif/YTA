name: iOS Simulator Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build YTA for iOS Simulator
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift package dependencies
        run: xcodebuild -resolvePackageDependencies -project YTA.xcodeproj -scheme YTA

      - name: List schemes
        run: xcodebuild -list -project YTA.xcodeproj

      - name: Build for iOS Simulator (no code signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project YTA.xcodeproj \
            -scheme YTA \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee xcodebuild.log

      - name: Show compile errors (only runs when the build fails)
        if: failure()
        run: |
          echo "===================== COMPILE ERRORS ====================="
          grep -E "(^|: )(error|fatal error): " xcodebuild.log || \
            grep -E "error:" xcodebuild.log || \
            echo "No 'error:' lines found — download the xcodebuild-log artifact for the full log."
          echo "==========================================================="

      - name: Upload full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Package simulator app
        run: |
          cd build/Build/Products/Debug-iphonesimulator
          zip -r YTA-Simulator-App.zip YTA.app

      - name: Upload simulator build artifact
        uses: actions/upload-artifact@v4
        with:
          name: YTA-iOS-Simulator-App
          path: build/Build/Products/Debug-iphonesimulator/YTA-Simulator-App.zip
          if-no-files-found: error
          retention-days: 30
